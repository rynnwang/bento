# bento platform Worker — Cloudflare Workers Builds config.
#
# This file exists ONLY so an automated `wrangler deploy` (run by Workers
# Builds on every push — see platform/README.md "Deploy") knows the entry
# point and which PRE-EXISTING R2 bucket / D1 database to attach. It does
# not create those resources — create the bucket and the database by hand
# in the CF dashboard first (same as always), then fill their real names/id
# in below and commit. This mirrors the existing convention in
# server/sync-worker/wrangler.toml and server/guestbook-daemon/wrangler.toml:
# bindings are plain config (not secret), API keys/tokens are not — those
# stay out of this file and are set with `wrangler secret put` if ever needed.
#
# `name` MUST match the actual connected Worker's name exactly, or a manual
# `wrangler deploy` targets a DIFFERENT (likely nonexistent) Worker — this
# was wrong for a while (said "bento-platform"; the real Worker is "bento")
# without anything breaking, because Workers Builds' CI deploy targets
# whatever Worker it's connected to regardless of this field. It only bit
# when debugging locally: `wrangler deployments list --name bento-platform`
# returned "this Worker does not exist." Keep this correct even though CI
# tolerates it being wrong.

name = "bento"
main = "src/index.ts"
compatibility_date = "2026-08-08"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "bento-platform"

[[d1_databases]]
binding = "DB"
database_name = "bento-platform"
database_id = "9408e034-8812-402a-ac21-42bd78f9f24f"

# Browser Rendering (env.ts's BROWSER, driven via @cloudflare/puppeteer in
# pdf.ts) — a real, Cloudflare-managed headless Chromium for the server-side
# "Download PDF" feature. Free-tier limited: see env.ts's BROWSER doc comment.
# compatibility_date above is already >= 2026-08-04, so nodejs_compat (which
# @cloudflare/puppeteer needs) is on by default — no compatibility_flags line
# needed here (see docs/DECISIONS.md).
[browser]
binding = "BROWSER"
